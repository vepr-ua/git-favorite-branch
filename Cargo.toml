[package]
authors = ["Revent Studio", "Maks Yadvinskyy <maks@revent.studio>"]
categories = ["command-line-utilities"]
description = "Tiny CLI to check out the same branch in every repo without retyping the name"
edition = "2021"
homepage = "https://github.com/vepr-ua/git-favorite-branch"
keywords = ["git_tool", "branch", "git_branch", "multibranch", "managment"]
license-file = "LICENSE.txt"
name = "gfb"
readme = "README.md"
repository = "https://github.com/vepr-ua/git-favorite-branch"
version = "1.3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
git2 = "0.21.0"
serde = {version = "1.0.156", features = ["derive"]}
serde_json = "1.0.94"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[[test]]
name = "e2e"
path = "e2e/main.rs"
